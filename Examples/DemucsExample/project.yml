name: DemucsExample
options:
  bundleIdPrefix: ai.splitfire
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

packages:
  Demucs:
    path: ../..

targets:
  DemucsExample:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - README.md
          - "*.xcodeproj"
    dependencies:
      - package: Demucs
        product: Demucs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.splitfire.DemucsExample
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Demucs Example
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
